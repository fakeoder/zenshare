<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Zenshare</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="shell topbar-inner">
        <a class="brand" href="/"><span class="brand-mark">Z</span>Zenshare</a>
        <div class="topbar-actions">
          <a
            class="nav-link active"
            href="/browse.html"
            aria-current="page"
            data-i18n-title="publicShares"
            data-i18n-aria-label="publicShares"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <line x1="8" x2="21" y1="6" y2="6" />
              <line x1="8" x2="21" y1="12" y2="12" />
              <line x1="8" x2="21" y1="18" y2="18" />
              <line x1="3" x2="3.01" y1="6" y2="6" />
              <line x1="3" x2="3.01" y1="12" y2="12" />
              <line x1="3" x2="3.01" y1="18" y2="18" />
            </svg>
            <span data-i18n="publicShares"></span>
          </a>
          <div class="lang-switch" role="group" aria-label="Language">
            <button type="button" data-action="lang" data-set-lang="zh">中</button>
            <button type="button" data-action="lang" data-set-lang="en">EN</button>
          </div>
          <button
            type="button"
            class="icon-btn"
            data-action="theme"
            data-i18n-title="toggleTheme"
          >
            <svg
              class="icon-sun"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2" />
              <path d="M12 20v2" />
              <path d="m4.93 4.93 1.41 1.41" />
              <path d="m17.66 17.66 1.41 1.41" />
              <path d="M2 12h2" />
              <path d="M20 12h2" />
              <path d="m6.34 17.66-1.41 1.41" />
              <path d="m19.07 4.93-1.41 1.41" />
            </svg>
            <svg
              class="icon-moon"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401" />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main class="shell browse-shell">
      <section class="browse-panel">
        <header class="browse-head">
          <h1 class="page-title" data-i18n="browseTitle"></h1>
          <p class="upload-subtitle" data-i18n="browseSubtitle"></p>
        </header>

        <form id="browseForm" class="browse-filters" role="search" novalidate>
          <label class="search-field">
            <svg
              class="search-icon"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="11" cy="11" r="8" />
              <path d="m21 21-4.3-4.3" />
            </svg>
            <input
              id="searchInput"
              class="text-input"
              type="search"
              maxlength="100"
              autocomplete="off"
              spellcheck="false"
              data-i18n-placeholder="searchPlaceholder"
            />
          </label>
          <div class="segmented" role="group" aria-label="Filter">
            <button type="button" class="active" data-filter="all" data-i18n="filterAll"></button>
            <button type="button" data-filter="permanent" data-i18n="filterPermanent"></button>
          </div>
        </form>

        <div id="browseMeta" class="browse-meta" aria-live="polite"></div>
        <div id="browseList" class="browse-list"></div>

        <div id="browseEmpty" class="browse-empty" hidden>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="11" cy="11" r="8" />
            <path d="m21 21-4.3-4.3" />
            <path d="m8 11 2 2 4-4" />
          </svg>
          <p data-i18n="noResults"></p>
        </div>

        <p id="browseError" class="form-error" role="alert" hidden></p>

        <nav id="browsePager" class="browse-pager" aria-label="Pagination" hidden>
          <button id="prevBtn" class="btn ghost small" type="button" data-i18n="previousPage"></button>
          <span id="pageInfo" class="page-info"></span>
          <button id="nextBtn" class="btn ghost small" type="button" data-i18n="nextPage"></button>
        </nav>
      </section>
    </main>

    <footer class="footer">
      <div class="shell">
        <div class="footer-inner">
          <div class="footer-brand">
            <a class="brand" href="/"><span class="brand-mark">Z</span>Zenshare</a>
            <p class="muted footer-tagline" data-i18n="tagline"></p>
          </div>
          <nav class="footer-links" aria-label="Footer">
            <a href="/browse.html" data-i18n="publicShares"></a>
            <a href="/privacy.html" data-i18n="privacy"></a>
            <a href="/terms.html" data-i18n="terms"></a>
            <a href="/status.html" data-i18n="statusTitle"></a>
            <a href="https://zkraft.cc" target="_blank" rel="noreferrer" data-i18n="products"></a>
            <a href="mailto:contact@zkraft.cc" data-i18n="contact"></a>
            <a href="/license.txt" target="_blank" data-i18n="license"></a>
            <a href="https://github.com/fakeoder/zenshare" target="_blank" rel="noreferrer" data-i18n="openSource"></a>
          </nav>
        </div>
        <div class="footer-bottom">
          <span>© 2026 Zenshare</span>
          <span class="muted" data-i18n="copyright"></span>
        </div>
      </div>
    </footer>

    <script src="/site.js"></script>
    <script src="/browse.js"></script>
  </body>
</html>
