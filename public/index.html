<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Zenshare</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="shell topbar-inner">
        <a class="brand" href="/"><span class="brand-mark">Z</span>Zenshare</a>
        <div class="topbar-actions">
          <div class="lang-switch" role="group" aria-label="Language">
            <button type="button" data-action="lang" data-set-lang="zh">中</button>
            <button type="button" data-action="lang" data-set-lang="en">EN</button>
          </div>
          <button
            type="button"
            class="icon-btn"
            data-action="theme"
            data-i18n-title="toggleTheme"
          >
            <svg
              class="icon-sun"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2" />
              <path d="M12 20v2" />
              <path d="m4.93 4.93 1.41 1.41" />
              <path d="m17.66 17.66 1.41 1.41" />
              <path d="M2 12h2" />
              <path d="M20 12h2" />
              <path d="m6.34 17.66-1.41 1.41" />
              <path d="m19.07 4.93-1.41 1.41" />
            </svg>
            <svg
              class="icon-moon"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401" />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main class="shell">
      <h1 class="page-title" data-i18n="newShare"></h1>
      <form id="shareForm" class="upload-grid" novalidate>
        <div class="form-main">
          <div class="field">
            <span class="field-label" data-i18n="htmlFile"></span>
            <input id="fileInput" type="file" accept=".html,.htm,text/html" hidden />
            <span id="fileDrop" class="dropzone" role="button" tabindex="0">
              <svg
                class="button-icon"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M12 3v12" />
                <path d="m17 8-5-5-5 5" />
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              </svg>
              <span id="fileText" data-i18n="pickFile"></span>
            </span>
            <span id="fileMeta" class="field-hint"></span>
            <section id="previewPanel" class="preview-panel" hidden>
              <div class="preview-head">
                <span class="field-label" data-i18n="preview"></span>
              </div>
              <iframe
                id="previewFrame"
                class="preview-frame"
                sandbox="allow-scripts"
                title="Preview"
              ></iframe>
            </section>
          </div>

          <label class="field">
            <span class="field-label" data-i18n="alias"></span>
            <div class="input-with-status">
              <input
                id="aliasInput"
                class="text-input"
                type="text"
                maxlength="60"
                autocomplete="off"
                spellcheck="false"
                placeholder="my-report"
              />
              <span id="aliasStatus" class="alias-status" aria-live="polite"></span>
            </div>
            <span class="field-hint" data-i18n="aliasHint"></span>
          </label>

          <div class="field-grid">
            <label class="field">
              <span class="field-label" data-i18n="title"></span>
              <input
                id="titleInput"
                class="text-input"
                type="text"
                maxlength="200"
                data-i18n-placeholder="titlePlaceholder"
              />
            </label>
            <label class="field">
              <span class="field-label" data-i18n="author"></span>
              <input
                id="authorInput"
                class="text-input"
                type="text"
                maxlength="100"
                data-i18n-placeholder="authorPlaceholder"
              />
            </label>
          </div>

          <label class="field">
            <span class="field-label" data-i18n="description"></span>
            <textarea
              id="descInput"
              class="text-input"
              rows="3"
              maxlength="1000"
              data-i18n-placeholder="descriptionPlaceholder"
            ></textarea>
          </label>

          <label class="field">
            <span class="field-label" data-i18n="tags"></span>
            <input
              id="tagsInput"
              class="text-input"
              type="text"
              maxlength="200"
              data-i18n-placeholder="tagsPlaceholder"
            />
          </label>
        </div>

        <div class="form-side">
          <label class="field">
            <span class="field-label" data-i18n="expiresIn"></span>
            <select id="expirySelect" class="text-input"></select>
          </label>

          <label class="field">
            <span class="field-label" data-i18n="accessPassword"></span>
            <input
              id="passwordInput"
              class="text-input"
              type="password"
              autocomplete="new-password"
              data-i18n-placeholder="optional"
            />
          </label>

          <button id="submitBtn" class="btn primary" type="submit">
            <svg
              class="button-icon"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M12 3v12" />
              <path d="m17 8-5-5-5 5" />
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            </svg>
            <span id="submitLabel" data-i18n="createShare"></span>
          </button>

          <section id="resultPanel" class="result-panel" hidden>
            <span class="badge success" data-i18n="created"></span>
            <label class="field">
              <span class="field-label" data-i18n="shareLink"></span>
              <input id="resultLink" class="text-input" type="text" readonly />
            </label>
            <div class="result-actions">
              <button id="copyLinkBtn" class="btn ghost" type="button">
                <svg
                  class="button-icon"
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
                  <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
                </svg>
                <span id="copyLinkLabel" data-i18n="copyLink"></span>
              </button>
              <button id="copyPwdBtn" class="btn ghost" type="button" hidden>
                <svg
                  class="button-icon"
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
                  <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                </svg>
                <span id="copyPwdLabel" data-i18n="copyWithPassword"></span>
              </button>
              <button id="openLinkBtn" class="btn ghost" type="button">
                <svg
                  class="button-icon"
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M15 3h6v6" />
                  <path d="M10 14 21 3" />
                  <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
                </svg>
                <span id="openLinkLabel" data-i18n="openLink"></span>
              </button>
            </div>
          </section>

          <p id="formError" class="form-error" role="alert" hidden></p>
        </div>
      </form>
    </main>

    <footer class="footer">
      <div class="shell">
        <div class="footer-inner">
          <div class="footer-brand">
            <a class="brand" href="/"><span class="brand-mark">Z</span>Zenshare</a>
            <p class="muted footer-tagline" data-i18n="tagline"></p>
          </div>
          <nav class="footer-links" aria-label="Footer">
            <a href="/privacy.html" data-i18n="privacy"></a>
            <a href="/terms.html" data-i18n="terms"></a>
            <a href="https://zkraft.cc" target="_blank" rel="noreferrer" data-i18n="products"></a>
            <a href="mailto:contact@zkraft.cc" data-i18n="contact"></a>
            <a href="/license.txt" target="_blank" data-i18n="license"></a>
            <a href="https://github.com/fakeoder/zenshare" target="_blank" rel="noreferrer" data-i18n="openSource"></a>
          </nav>
        </div>
        <div class="footer-bottom">
          <span>© 2026 Zenshare</span>
          <span class="muted" data-i18n="copyright"></span>
        </div>
      </div>
    </footer>

    <script src="/site.js"></script>
    <script src="/upload.js"></script>
  </body>
</html>
