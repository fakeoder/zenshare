<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Zenshare</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="view-body">
    <script type="application/json" id="share-data"><!--__SHARE_DATA__--></script>

    <div class="view-stage">
      <iframe
        id="shareFrame"
        class="share-frame"
        sandbox="allow-scripts allow-modals"
        title="Zenshare"
      ></iframe>

      <div id="lockScreen" class="lock-screen" hidden>
        <div class="lock-box">
          <div class="lock-icon">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
          </div>
          <h1 id="lockTitle" class="lock-title" data-i18n="passwordProtected"></h1>
          <p id="lockMeta" class="lock-meta muted"></p>
          <div class="lock-form">
            <input
              id="passwordInput"
              class="text-input"
              type="password"
              autocomplete="current-password"
              data-i18n-placeholder="passwordPlaceholder"
            />
            <button id="unlockBtn" class="btn primary" type="button">
              <svg
                class="button-icon"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
              </svg>
              <span data-i18n="unlock"></span>
            </button>
          </div>
          <p id="lockError" class="form-error" role="alert" hidden data-i18n="passwordError"></p>
        </div>
      </div>
    </div>

    <div id="toolbar" class="toolbar" hidden>
      <button
        id="menuBtn"
        class="icon-btn toolbar-trigger"
        type="button"
        aria-haspopup="menu"
        aria-expanded="false"
        data-i18n-title="moreActions"
        data-i18n-aria-label="moreActions"
      >
        <svg
          class="icon-more"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="1" />
          <circle cx="19" cy="12" r="1" />
          <circle cx="5" cy="12" r="1" />
        </svg>
        <svg
          class="icon-close"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M18 6 6 18" />
          <path d="m6 6 12 12" />
        </svg>
      </button>

      <div id="actionMenu" class="action-menu" role="menu" hidden>
        <a class="action-menu-item" href="/" role="menuitem">
          <span class="brand-letter">Z</span>
          <span data-i18n="backHome"></span>
        </a>
        <button id="metaBtn" class="action-menu-item" type="button" role="menuitem">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="10" />
            <path d="M12 16v-4" />
            <path d="M12 8h.01" />
          </svg>
          <span data-i18n="info"></span>
        </button>
        <button id="downloadBtn" class="action-menu-item" type="button" role="menuitem">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M12 15V3" />
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <path d="m7 10 5 5 5-5" />
          </svg>
          <span data-i18n="downloadHtml"></span>
        </button>
        <button id="shareBtn" class="action-menu-item" type="button" role="menuitem">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="18" cy="5" r="3" />
            <circle cx="6" cy="12" r="3" />
            <circle cx="18" cy="19" r="3" />
            <line x1="8.59" x2="15.42" y1="13.51" y2="17.49" />
            <line x1="15.41" x2="8.59" y1="6.51" y2="10.49" />
          </svg>
          <span data-i18n="share"></span>
        </button>
      </div>
    </div>

    <div id="shareToast" class="share-toast" role="status" aria-live="polite" hidden></div>

    <div id="metaPanel" class="meta-panel" hidden>
      <div class="meta-panel-head">
        <strong id="metaTitle"></strong>
        <button id="metaCloseBtn" class="icon-btn small" type="button" data-i18n-title="close">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M18 6 6 18" />
            <path d="m6 6 12 12" />
          </svg>
        </button>
      </div>
      <div id="metaBody" class="meta-body"></div>
    </div>

    <script src="/site.js"></script>
    <script src="/view.js"></script>
  </body>
</html>
