<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Zenshare - share static HTML files simply." />
    <title>Zenshare</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        --bg: #f4f3ef;
        --surface: #ffffff;
        --surface-soft: #fbfbf9;
        --ink: #1f242a;
        --muted: #6a737c;
        --line: #dcdeda;
        --line-strong: #c4c8c4;
        --accent: #0e766d;
        --accent-soft: #dff1ed;
        --warm: #a16207;
        --warm-soft: #f7ecd7;
        --danger: #b93a34;
        --radius: 8px;
        --shadow: 0 16px 44px rgba(24, 28, 31, 0.1);
        --font: "Segoe UI", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
      }

      [data-theme="dark"] {
        --bg: #111417;
        --surface: #181c20;
        --surface-soft: #1d2227;
        --ink: #e7eaed;
        --muted: #9aa4ad;
        --line: #2a3037;
        --line-strong: #3a424b;
        --accent: #42c6b4;
        --accent-soft: rgba(66, 198, 180, 0.14);
        --warm: #e3a45c;
        --warm-soft: rgba(227, 164, 92, 0.14);
        --danger: #f08a83;
        --shadow: 0 18px 50px rgba(0, 0, 0, 0.4);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
      }

      body {
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--font);
        font-size: 15px;
        letter-spacing: 0;
        line-height: 1.55;
        transition:
          background-color 0.2s ease,
          color 0.2s ease;
      }

      a {
        color: var(--accent);
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      .muted {
        color: var(--muted);
      }

      .shell {
        width: min(1080px, calc(100% - 32px));
        margin: 0 auto;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 30;
        background: color-mix(in srgb, var(--surface) 92%, transparent);
        border-bottom: 1px solid var(--line);
        backdrop-filter: blur(14px);
      }

      .topbar-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        min-height: 64px;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: var(--ink);
        font-size: 18px;
        font-weight: 800;
        text-decoration: none;
      }

      .brand:hover {
        text-decoration: none;
      }

      .brand-mark {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 30px;
        height: 30px;
        border-radius: 6px;
        background: var(--ink);
        color: var(--bg);
        font-weight: 800;
      }

      .topbar-links,
      .topbar-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .topbar-link {
        color: var(--muted);
        font-size: 13px;
        font-weight: 600;
      }

      .lang-switch {
        display: inline-flex;
        padding: 3px;
        border: 1px solid var(--line-strong);
        border-radius: 999px;
        background: var(--surface);
      }

      .lang-switch button {
        min-width: 38px;
        height: 28px;
        padding: 0 10px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }

      .lang-switch button.active {
        background: var(--ink);
        color: var(--bg);
      }

      .icon-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        border: 1px solid var(--line-strong);
        border-radius: 999px;
        background: var(--surface);
        color: var(--ink);
        cursor: pointer;
        transition:
          border-color 0.15s ease,
          color 0.15s ease;
      }

      .icon-btn:hover {
        border-color: var(--accent);
        color: var(--accent);
      }

      .icon-btn svg {
        width: 18px;
        height: 18px;
      }

      .icon-btn .icon-sun {
        display: none;
      }

      [data-theme="dark"] .icon-btn .icon-sun {
        display: block;
      }

      [data-theme="dark"] .icon-btn .icon-moon {
        display: none;
      }

      .hero {
        padding: 76px 0 96px;
        text-align: center;
      }

      .hero-eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 18px;
        padding: 5px 12px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--surface);
        color: var(--warm);
        font-size: 12px;
        font-weight: 700;
      }

      .hero h1 {
        margin: 0;
        font-size: 64px;
        letter-spacing: 0;
        line-height: 1.05;
      }

      .hero-tagline {
        margin: 18px auto 0;
        max-width: 620px;
        color: var(--ink);
        font-size: 20px;
        font-weight: 600;
      }

      .hero-lead {
        margin: 10px auto 0;
        max-width: 560px;
        color: var(--muted);
        font-size: 15px;
      }

      .hero-actions {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin-top: 30px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 42px;
        padding: 9px 18px;
        border: 1px solid transparent;
        border-radius: var(--radius);
        font: inherit;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
      }

      .btn:hover {
        text-decoration: none;
      }

      .btn.primary {
        background: var(--accent);
        color: #fff;
      }

      .btn.primary:hover {
        background: color-mix(in srgb, var(--accent) 86%, #000);
      }

      .btn.ghost {
        background: var(--surface);
        border-color: var(--line-strong);
        color: var(--ink);
      }

      .btn.ghost:hover {
        border-color: var(--accent);
        color: var(--accent);
      }

      .btn svg {
        width: 16px;
        height: 16px;
      }

      .hero-stats {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 34px;
        margin-top: 42px;
        color: var(--muted);
        font-size: 13px;
      }

      .hero-stat strong {
        display: block;
        margin-bottom: 2px;
        color: var(--ink);
        font-size: 18px;
      }

      .hero-mock {
        width: min(900px, calc(100% - 32px));
        margin: 58px auto -160px;
        text-align: left;
      }

      .browser-window {
        overflow: hidden;
        border: 1px solid var(--line-strong);
        border-radius: 12px;
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .browser-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 16px;
        border-bottom: 1px solid var(--line);
        background: var(--surface-soft);
      }

      .browser-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--line-strong);
      }

      .browser-url {
        flex: 1;
        margin-left: 10px;
        padding: 6px 12px;
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--muted);
        font-size: 12px;
      }

      .mock-body {
        display: grid;
        grid-template-columns: 1fr 1.2fr;
        gap: 22px;
        padding: 24px;
      }

      .mock-copy {
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .mock-copy h2 {
        margin: 0 0 8px;
        font-size: 22px;
        letter-spacing: 0;
      }

      .mock-copy p {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
      }

      .mock-list {
        display: grid;
        gap: 10px;
        margin-top: 18px;
      }

      .mock-row {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 38px;
        padding: 8px 12px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface-soft);
        font-size: 13px;
      }

      .mock-check {
        color: var(--accent);
        font-weight: 800;
      }

      .mock-panel {
        display: grid;
        gap: 12px;
        padding: 18px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface);
      }

      .mock-file {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 58px;
        padding: 12px;
        border: 1px dashed var(--line-strong);
        border-radius: var(--radius);
        background: var(--surface-soft);
        color: var(--muted);
        font-size: 13px;
      }

      .mock-file svg {
        width: 18px;
        height: 18px;
        color: var(--accent);
      }

      .mock-grid {
        display: grid;
        grid-template-columns: 1.2fr 1fr;
        gap: 10px;
      }

      .mock-field-label {
        display: block;
        margin-bottom: 6px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 600;
      }

      .mock-switch {
        display: inline-flex;
        padding: 3px;
        border: 1px solid var(--line-strong);
        border-radius: 999px;
        background: var(--surface-soft);
      }

      .mock-switch button {
        min-width: 58px;
        height: 30px;
        padding: 0 12px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }

      .mock-switch button.active {
        background: var(--ink);
        color: var(--bg);
      }

      .mock-select {
        display: flex;
        align-items: center;
        height: 36px;
        padding: 0 10px;
        border: 1px solid var(--line-strong);
        border-radius: var(--radius);
        background: var(--surface-soft);
        color: var(--muted);
        font-size: 13px;
      }

      .mock-password {
        overflow: hidden;
        max-height: 0;
        opacity: 0;
        transition:
          max-height 0.2s ease,
          opacity 0.2s ease;
      }

      .mock-password.open {
        max-height: 70px;
        opacity: 1;
      }

      .mock-password input {
        width: 100%;
        height: 38px;
        padding: 0 12px;
        border: 1px solid var(--line-strong);
        border-radius: var(--radius);
        background: var(--surface-soft);
        color: var(--ink);
        font: inherit;
      }

      .mock-link {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--accent-soft);
        color: var(--ink);
        font-size: 12px;
      }

      .mock-link span {
        min-width: 0;
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .mock-link svg {
        width: 15px;
        height: 15px;
        flex: none;
        color: var(--accent);
      }

      section {
        padding: 110px 0;
      }

      .section-head {
        margin-bottom: 30px;
      }

      .section-head h2 {
        margin: 0;
        font-size: 30px;
        letter-spacing: 0;
      }

      .section-head p {
        margin: 8px 0 0;
        color: var(--muted);
      }

      .steps,
      .features {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
      }

      .feature {
        padding: 20px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface);
      }

      .feature-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        margin-bottom: 14px;
        border-radius: var(--radius);
        background: var(--accent-soft);
        color: var(--accent);
      }

      .feature-icon svg {
        width: 18px;
        height: 18px;
      }

      .feature h3 {
        margin: 0 0 6px;
        font-size: 16px;
        letter-spacing: 0;
      }

      .feature p {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
      }

      .step-number {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 30px;
        height: 30px;
        margin-bottom: 14px;
        border-radius: 50%;
        background: var(--warm-soft);
        color: var(--warm);
        font-weight: 800;
      }

      .security {
        background: var(--surface);
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
      }

      .security-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 26px;
      }

      .security-item h3 {
        margin: 0 0 8px;
        font-size: 16px;
        letter-spacing: 0;
      }

      .security-item p {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
      }

      .footer {
        padding: 34px 0 28px;
        background: var(--surface);
      }

      .footer-inner {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 28px;
        flex-wrap: wrap;
      }

      .footer-links {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 18px;
      }

      .footer-links a {
        color: var(--muted);
        font-size: 13px;
        font-weight: 500;
      }

      .footer-links a:hover {
        color: var(--accent);
        text-decoration: none;
      }

      .footer-bottom {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 22px;
        padding-top: 16px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 12px;
      }

      .intro-steps {
        padding-top: 210px;
      }

      @media (max-width: 860px) {
        .hero h1 {
          font-size: 48px;
        }

        .mock-body {
          grid-template-columns: 1fr;
        }

        .steps,
        .features,
        .security-grid {
          grid-template-columns: 1fr;
        }

        .intro-steps {
          padding-top: 96px;
        }

        .hero-mock {
          margin-top: 34px;
        }
      }

      @media (max-width: 600px) {
        .shell {
          width: min(100% - 24px, 1080px);
        }

        .hero {
          padding: 58px 0 64px;
        }

        .hero h1 {
          font-size: 40px;
        }

        .hero-actions,
        .hero-stats {
          flex-direction: column;
          gap: 10px;
        }

        .hero-stats {
          gap: 16px;
        }

        .topbar-links {
          display: none;
        }

        .mock-grid {
          grid-template-columns: 1fr;
        }

        section {
          padding: 72px 0;
        }

        .footer-inner {
          flex-direction: column;
          gap: 18px;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="shell topbar-inner">
        <span class="brand"><span class="brand-mark">Z</span>Zenshare</span>
        <div class="topbar-actions">
          <div class="lang-switch" role="group" aria-label="Language">
            <button type="button" data-set-lang="zh">中</button>
            <button type="button" data-set-lang="en">EN</button>
          </div>
          <button type="button" class="icon-btn" data-action="theme" data-i18n-title="toggleTheme" aria-label="Toggle theme">
            <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2" />
              <path d="M12 20v2" />
              <path d="m4.93 4.93 1.41 1.41" />
              <path d="m17.66 17.66 1.41 1.41" />
              <path d="M2 12h2" />
              <path d="M20 12h2" />
              <path d="m6.34 17.66-1.41 1.41" />
              <path d="m19.07 4.93-1.41 1.41" />
            </svg>
            <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401" />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main>
      <section class="hero">
        <div class="shell">
          <p class="hero-eyebrow" data-i18n="tagline"></p>
          <h1>Zenshare</h1>
          <p class="hero-tagline" data-i18n="lead"></p>
          <div class="hero-actions">
            <a
              class="btn primary"
              href="https://zenshare.zkraft.cc/"
              target="_blank"
              rel="noreferrer"
            >
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M7 17 17 7" />
                <path d="M7 7h10v10" />
              </svg>
              <span data-i18n="tryNow"></span>
            </a>
          </div>
          <div class="hero-stats">
            <div class="hero-stat"><strong>512KB</strong><span data-i18n="statMax"></span></div>
            <div class="hero-stat"><strong>2000</strong><span data-i18n="statCapacity"></span></div>
            <div class="hero-stat"><strong data-i18n="statRetentionValue"></strong><span data-i18n="statRetention"></span></div>
          </div>
        </div>

        <div class="hero-mock" aria-hidden="true">
          <div class="browser-window">
            <div class="browser-bar">
              <span class="browser-dot"></span>
              <span class="browser-dot"></span>
              <span class="browser-dot"></span>
              <span class="browser-url">https://zenshare.app/</span>
            </div>
            <div class="mock-body">
              <div class="mock-copy">
                <h2 data-i18n="mockTitle"></h2>
                <p data-i18n="mockSubtitle"></p>
                <div class="mock-list">
                  <div class="mock-row"><span class="mock-check">✓</span><span data-i18n="mockRowOne"></span></div>
                  <div class="mock-row"><span class="mock-check">✓</span><span data-i18n="mockRowTwo"></span></div>
                  <div class="mock-row"><span class="mock-check">✓</span><span data-i18n="mockRowThree"></span></div>
                </div>
              </div>
              <div class="mock-panel">
                <div class="mock-file">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 3v12" />
                    <path d="m17 8-5-5-5 5" />
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                  </svg>
                  <span data-i18n="mockFile"></span>
                </div>
                <div class="mock-grid">
                  <div>
                    <span class="mock-field-label" data-i18n="mockVisibility"></span>
                    <div class="mock-switch">
                      <button type="button" class="active" data-mock-visibility="public" data-i18n="mockPublic"></button>
                      <button type="button" data-mock-visibility="private" data-i18n="mockPrivate"></button>
                    </div>
                  </div>
                  <div>
                    <span class="mock-field-label" data-i18n="mockRetention"></span>
                    <div class="mock-select" data-i18n="mockRetentionValue"></div>
                  </div>
                </div>
                <div id="mockPassword" class="mock-password">
                  <span class="mock-field-label" data-i18n="mockPassword"></span>
                  <input type="password" tabindex="-1" />
                </div>
                <div class="mock-link">
                  <span>https://zenshare.app/s/demo-report</span>
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
                    <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
                  </svg>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="intro-steps">
        <div class="shell">
          <div class="section-head">
            <h2 data-i18n="stepTitle"></h2>
          </div>
          <div class="steps">
            <div class="feature">
              <span class="step-number">01</span>
              <h3 data-i18n="step1Title"></h3>
              <p data-i18n="step1Desc"></p>
            </div>
            <div class="feature">
              <span class="step-number">02</span>
              <h3 data-i18n="step2Title"></h3>
              <p data-i18n="step2Desc"></p>
            </div>
            <div class="feature">
              <span class="step-number">03</span>
              <h3 data-i18n="step3Title"></h3>
              <p data-i18n="step3Desc"></p>
            </div>
          </div>
        </div>
      </section>

      <section>
        <div class="shell">
          <div class="section-head">
            <h2 data-i18n="featuresTitle"></h2>
          </div>
          <div class="features">
            <div class="feature">
              <span class="feature-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 8-4 4 4 4" /><path d="m17 8 4 4-4 4" /><path d="M14 4l-4 16" /></svg></span>
              <h3 data-i18n="featureStaticTitle"></h3>
              <p data-i18n="featureStaticDesc"></p>
            </div>
            <div class="feature">

    <script>
      (function () {
        const LANG_KEY = 'zenshare.intro.lang';
        const THEME_KEY = 'zenshare.intro.theme';
        const LANGS = ['zh', 'en'];

        const DICT = {
          zh: {

            featureBilingualTitle: '双语与深浅色',

            mockRowThree: '浏览器端加密',
            mockFile: '选择 .html 文件',
            mockVisibility: '访问范围',
            mockPublic: '公开',
            mockPrivate: '私密',
            mockPassword: '访问密码',
            mockRetention: '保留时长',
            mockRetentionValue: '7 天',
            navNewShare: '新建分享',
            navPublic: '公开分享',
            footerPrivacy: '隐私政策',
            footerTerms: '使用条款',
            footerStatus: '服务状态',
            footerRights: '保留所有权利',
            toggleTheme: '切换深浅色',
          },
          en: {
            tagline: 'Static HTML sharing',
            lead: 'Upload a .html file, choose public or private, and get a shareable link.',
            startShare: 'Create a share',
            tryNow: 'Try it now',
            browseShares: 'Browse public shares',
            statMax: 'Max file size',
            statCapacity: 'Share capacity',
            statRetention: 'Default retention',
            statRetentionValue: '7 days',
            stepTitle: 'Share in three steps',
            step1Title: 'Choose an HTML file',
            step1Desc: 'One static .html file, up to 512KB.',
            step2Title: 'Set visibility',
            step2Desc: 'Public by default; Private requires an access password.',
            step3Title: 'Share the link',
            step3Desc: 'Get a standalone link to open or download the HTML.',
            featuresTitle: 'Design principles',
            featureStaticTitle: 'Static first',
            featureStaticDesc: 'Only static HTML, with no lasting dependencies.',
            featurePrivateTitle: 'Private can encrypt',
            featurePrivateDesc: 'Passwords encrypt in the browser; the server never stores them.',
            featureExpiryTitle: 'Auto expiry',
            featureExpiryDesc: 'Expired shares are cleaned up automatically, or keep them forever.',
            featurePublicTitle: 'Public discovery',
            featurePublicDesc: 'Unencrypted shares appear in the public directory with search and pagination.',
            featureSandboxTitle: 'Sandboxed rendering',
            featureSandboxDesc: 'Shared content renders in an isolated iframe and cannot reach the host site.',
            featureBilingualTitle: 'Bilingual & themes',
            featureBilingualDesc: 'Chinese and English UI with light and dark modes.',
            securityTitle: 'Access & privacy',
            securityPublicTitle: 'Public shares',
            securityPublicDesc: 'Unprotected shares are public by default and appear in the public directory.',
            securityPrivateTitle: 'Private shares',
            securityPrivateDesc: 'Password-protected shares stay out of the directory; decryption happens only in your browser.',
            securityRetentionTitle: 'Retention & cleanup',
            securityRetentionDesc: 'Expired content is removed; permanent shares remain.',
            mockTitle: 'Create a share',
            mockSubtitle: 'From file to link in a few steps.',
            mockRowOne: 'No account required',
            mockRowTwo: 'Public or private',
            mockRowThree: 'Browser-side encryption',
            mockFile: 'Select .html file',
            mockVisibility: 'Visibility',
            mockPublic: 'Public',
            mockPrivate: 'Private',
            mockPassword: 'Access password',
            mockRetention: 'Retention',
            mockRetentionValue: '7 days',
            navNewShare: 'New share',
            navPublic: 'Public shares',
            footerPrivacy: 'Privacy',
            footerTerms: 'Terms',
            footerStatus: 'Status',
            footerRights: 'All rights reserved',
            toggleTheme: 'Toggle theme',
          },
        };

        let lang = 'zh';
        let theme = 'light';
        try {
          const savedLang = localStorage.getItem(LANG_KEY);
          const savedTheme = localStorage.getItem(THEME_KEY);
          if (LANGS.includes(savedLang)) lang = savedLang;
          else if (String(navigator.language || '').toLowerCase().startsWith('zh')) lang = 'zh';
          else lang = 'en';
          theme = savedTheme === 'dark' ? 'dark' : 'light';
          if (savedTheme === null && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            theme = 'dark';
          }
        } catch {
          lang = String(navigator.language || '').toLowerCase().startsWith('zh') ? 'zh' : 'en';
        }

        function t(key) {
          return DICT[lang][key] !== undefined ? DICT[lang][key] : key;
        }

        function applyLang() {
          document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
          document.querySelectorAll('[data-i18n]').forEach((el) => {
            el.textContent = t(el.getAttribute('data-i18n'));
          });
          document.querySelectorAll('[data-i18n-title]').forEach((el) => {
            el.title = t(el.getAttribute('data-i18n-title'));
          });
          document.querySelectorAll('[data-set-lang]').forEach((btn) => {
            btn.classList.toggle('active', btn.getAttribute('data-set-lang') === lang);
          });
        }

        function applyTheme() {
          document.documentElement.dataset.theme = theme;
        }

        function setLang(next) {
          if (!LANGS.includes(next)) return;
          lang = next;
          try {
            localStorage.setItem(LANG_KEY, lang);
          } catch {
          }
          applyLang();
        }

        function setTheme(next) {
          theme = next;
          try {
            localStorage.setItem(THEME_KEY, theme);
          } catch {
          }
          applyTheme();
        }

        document.querySelectorAll('[data-set-lang]').forEach((btn) => {
          btn.addEventListener('click', () => setLang(btn.getAttribute('data-set-lang')));
        });

        document.querySelectorAll('[data-action="theme"]').forEach((btn) => {
          btn.addEventListener('click', () => setTheme(theme === 'dark' ? 'light' : 'dark'));
        });

        document.querySelectorAll('[data-mock-visibility]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const isPrivate = btn.getAttribute('data-mock-visibility') === 'private';
            document.querySelectorAll('[data-mock-visibility]').forEach((other) => {
              other.classList.toggle('active', other === btn);
            });
            document.getElementById('mockPassword').classList.toggle('open', isPrivate);
          });
        });

        applyLang();
        applyTheme();
      })();
    </script>
