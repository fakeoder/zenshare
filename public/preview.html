<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Zenshare</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="preview-body">
    <header class="preview-header">
      <strong id="previewName" class="preview-name" data-i18n="preview"></strong>
      <button id="previewCloseBtn" class="icon-btn small" type="button" data-i18n-title="close">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 6 6 18" />
          <path d="m6 6 12 12" />
        </svg>
      </button>
    </header>
    <main class="preview-stage">
      <iframe id="previewFrame" class="preview-frame" sandbox="allow-scripts allow-modals" title="Preview"></iframe>
      <div id="previewEmpty" class="preview-empty" hidden>
        <p data-i18n="previewUnavailable"></p>
        <a class="btn ghost" href="/" data-i18n="backHome"></a>
      </div>
    </main>
    <script src="/site.js"></script>
    <script src="/preview.js"></script>
  </body>
</html>
